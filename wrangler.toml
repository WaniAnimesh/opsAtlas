name = "opsatlas-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://opsatlas.pages.dev"   # production Pages domain; localhost:3000 is added in [env.dev]

[[d1_databases]]
binding = "DB"
database_name = "opsatlas"
database_id = "1f9bdf4b-f67f-409e-99a3-c3037da3c93f"   # replace with the id printed by `wrangler d1 create opsatlas`
migrations_dir = "db/migrations"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["0 3 * * *"]                                   # daily 03:00 UTC

[observability]
enabled = false                                         # request URLs contain Session_Keys

# `wrangler dev --env dev` / `wrangler deploy --env dev`. Bindings are not inherited by named
# environments, so they are repeated here.
[env.dev]
name = "opsatlas-api-dev"

[env.dev.vars]
ALLOWED_ORIGINS = "https://opsatlas.pages.dev,http://localhost:3000"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "opsatlas"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "db/migrations"

[[env.dev.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[env.dev.observability]
enabled = false
